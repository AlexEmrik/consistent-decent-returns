[project]
name = "decent_returns"
version = "0.0.1"
description = "Long only portfolio optimization to achieve consistent, decent returns."
authors = [
    { name = "Nikhil Devanathan", email = "ndev@stanford.edu" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "cvxcovariance>=0.1.9",
    "cvxpy>=1.7.3",
    "fastparquet>=2024.11.0",
    "fredapi>=0.5.2",
    "lightgbm>=4.6.0",
    "marimo>=0.17.0",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "plotly>=6.3.1",
    "pyarrow>=23.0.1",
    "pyinstrument>=5.1.2",
    "rich>=14.2.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "statsmodels>=0.14.5",
    "tqdm>=4.67.1",
    "typer>=0.20.0",
    "yfinance>=0.2.66",
]

[dependency-groups]
dev = [
    "seaborn>=0.13.0",
]

[tool.marimo.runtime]
output_max_bytes = 20_000_000

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decent_returns"]

# ---------------
# Testing
# ---------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["src/decent_returns"]

[tool.coverage.report]
show_missing = true
skip_covered = true